services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webapi-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=webapi;Username=webapi;Password=${POSTGRES_PASSWORD}
      - Redis__Configuration=redis:6379,abortConnect=false
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=WebAPI
      - Jwt__Audience=WebAPIUsers

  postgres:
    image: postgres:16-alpine
    container_name: webapi-postgres
    environment:
      POSTGRES_DB: webapi
      POSTGRES_USER: webapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapi -d webapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: webapi-redis-prod
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

